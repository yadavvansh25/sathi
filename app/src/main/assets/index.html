<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SurakshaAR - Industrial Safety & AR Fire Assistant</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons
    const Icons = {
      Shield: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      ),
      Flame: () => (
        <svg className="w-5 h-5 text-amber-500 fill-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      ),
      Gauge: () => (
        <svg className="w-5 h-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      ),
      HardHat: () => (
        <svg className="w-5 h-5 text-sky-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a8 8 0 0 1 16 0v3"/></svg>
      ),
      Camera: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      ),
      Crosshair: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
      ),
      Power: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      ),
      Lock: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      ),
      Wind: () => (
        <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
      ),
      Award: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
      ),
      Layers: () => (
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      ),
      Check: () => (
        <svg className="w-5 h-5 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
      )
    };

    function App() {
      const [tab, setTab] = useState('modules'); // 'modules' | 'ar_camera' | 'assessment' | 'cert'
      const [lang, setLang] = useState('en');

      // Camera State
      const [cameraActive, setCameraActive] = useState(false);
      const [viewMode, setViewMode] = useState('CAMERA_AR'); // 'CAMERA_AR' | 'CANVAS_2D'
      const [cameraError, setCameraError] = useState(null);
      const videoRef = useRef(null);
      const streamRef = useRef(null);

      // PASS Steps
      const [passStep, setPassStep] = useState(1);
      const [powerOff, setPowerOff] = useState(false);
      const [pinPulled, setPinPulled] = useState(false);
      const [aimLocked, setAimLocked] = useState(false);
      const [fireIntensity, setFireIntensity] = useState(100);
      const [fireExtinguished, setFireExtinguished] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);

      // 4-Gas Sniffer Dynamic Telemetry State (H2S, O2, CO, CH4)
      const [o2Val, setO2Val] = useState(17.4);    // <19.5% deficiency alarm
      const [coVal, setCoVal] = useState(380);     // >50 ppm lethal alarm
      const [h2sVal, setH2sVal] = useState(14.8);  // >10 ppm fatal sour gas
      const [ch4Val, setCh4Val] = useState(1.35);  // >1.25% LEL threshold

      // Continuous sensor jitter simulating active suction pump
      useEffect(() => {
        const interval = setInterval(() => {
          if (fireIntensity > 0) {
            setO2Val(prev => +(17.4 + (Math.random() - 0.5) * 0.2).toFixed(1));
            setCoVal(prev => Math.round(380 + (Math.random() - 0.5) * 8));
            setH2sVal(prev => +(14.8 + (Math.random() - 0.5) * 0.4).toFixed(1));
            setCh4Val(prev => +(1.35 + (Math.random() - 0.5) * 0.04).toFixed(2));
          } else {
            setO2Val(prev => +(20.9 + (Math.random() - 0.5) * 0.1).toFixed(1));
            setCoVal(prev => Math.round(14 + (Math.random() - 0.5) * 3));
            setH2sVal(prev => +(0.4 + (Math.random() - 0.5) * 0.1).toFixed(1));
            setCh4Val(prev => +(0.08 + (Math.random() - 0.5) * 0.02).toFixed(2));
          }
        }, 1200);
        return () => clearInterval(interval);
      }, [fireIntensity]);

      // Assessment State
      const [qIndex, setQIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [modalOpen, setModalOpen] = useState(false);

      const questions = [
        {
          q: { en: 'What must you do first before using an extinguisher on electrical equipment?', hi: 'विद्युत पैनल पर आग बुझाने से पहले पहला कदम क्या है?' },
          opts: [
            { en: 'Pour pressurized water', hi: 'पानी डालें' },
            { en: 'Isolate main 440V electrical power', hi: 'मुख्य 440V बिजली लाइन बंद करें' },
            { en: 'Wave a cloth', hi: 'कपड़ा हिलाएं' }
          ],
          ans: 1
        },
        {
          q: { en: 'Where must you direct the fire extinguisher stream in the P.A.S.S. protocol?', hi: 'P.A.S.S. विधि में अग्निशामक का स्प्रे कहाँ मारना चाहिए?' },
          opts: [
            { en: 'Directly at the base of the fire', hi: 'आग की जड़ (आधार) पर' },
            { en: 'High up into the smoke', hi: 'ऊपर धुएं में' },
            { en: 'At the ceiling', hi: 'छत पर' }
          ],
          ans: 0
        },
        {
          q: { en: 'What is the safe atmospheric Oxygen (O2) percentage for entering a mine sump?', hi: 'खदान सम्प/हौज में सुरक्षित O2 प्रतिशत कितना होना चाहिए?' },
          opts: [
            { en: 'Below 14%', hi: '14% से कम' },
            { en: '19.5% to 23.5%', hi: '19.5% से 23.5% के बीच' },
            { en: 'Over 45%', hi: '45% से अधिक' }
          ],
          ans: 1
        }
      ];

      // Speech audio guide
      const speak = (hiText, enText) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(lang === 'hi' ? hiText : enText);
          u.lang = lang === 'hi' ? 'hi-IN' : 'en-US';
          window.speechSynthesis.speak(u);
        }
      };

      const startCamera = async () => {
        setCameraError(null);
        try {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          }
          setCameraActive(true);
          setViewMode('CAMERA_AR');
        } catch (e) {
          setCameraError('Camera unavailable. 2D Simulation Canvas Mode activated.');
          setViewMode('CANVAS_2D');
          setCameraActive(false);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (videoRef.current) {
          videoRef.current.srcObject = null;
        }
        setCameraActive(false);
      };

      useEffect(() => {
        if (tab === 'ar_camera') {
          startCamera();
        } else {
          stopCamera();
        }
        return () => stopCamera();
      }, [tab]);

      // PASS Handlers
      const handlePower = () => {
        setPowerOff(true);
        setAlertMsg(null);
        setPassStep(2);
        speak('बिजली बंद हो गई है। अब पिन निकालें!', 'Power isolated. Pull the extinguisher pin now!');
      };

      const handlePin = () => {
        if (!powerOff) {
          setAlertMsg('CRITICAL: 440V Line Live! Isolate power first!');
          speak('रुको! पहले बिजली बंद करें!', 'Stop! Cut power first!');
          return;
        }
        setPinPulled(true);
        setPassStep(3);
        speak('पिन निकल गई है। अब आग की जड़ पर निशाना लगाएं!', 'Pin pulled. Aim crosshair at base of fire!');
      };

      const handleAim = () => {
        if (!pinPulled) return;
        setAimLocked(true);
        setPassStep(4);
        speak('निशाना लॉक हुआ। अब CO2 स्प्रे करें!', 'Target locked. Press and hold Spray CO2!');
      };

      const handleSpray = () => {
        if (!powerOff) {
          setAlertMsg('CRITICAL: Electrical shock risk! Power is still energized!');
          return;
        }
        let current = fireIntensity;
        const timer = setInterval(() => {
          current = Math.max(0, current - 25);
          setFireIntensity(current);
          setCoVal(prev => Math.max(14, prev - 90));
          setH2sVal(prev => +(Math.max(0.4, prev - 3.6)).toFixed(1));
          setO2Val(prev => +(Math.min(20.9, prev + 0.88)).toFixed(1));
          setCh4Val(prev => +(Math.max(0.08, prev - 0.32)).toFixed(2));

          if (current === 0) {
            clearInterval(timer);
            setFireExtinguished(true);
            speak('आग पूरी तरह बुझ गई है! बहुत अच्छा!', 'Fire extinguished successfully! Atmosphere safe!');
          }
        }, 400);
      };

      const resetDrill = () => {
        setPassStep(1);
        setPowerOff(false);
        setPinPulled(false);
        setAimLocked(false);
        setFireIntensity(100);
        setFireExtinguished(false);
        setAlertMsg(null);
        setO2Val(17.4);
        setCoVal(380);
        setH2sVal(14.8);
        setCh4Val(1.35);
      };

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-[#0F172A] flex flex-col justify-between max-w-md mx-auto shadow-2xl relative border-x border-[#E2E8F0]">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-2.5">
              <div className="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black">
                <Icons.Shield />
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <span className="text-base font-black tracking-tight">SurakshaAR</span>
                  <span className="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded border border-amber-300">KHANSUAR</span>
                </div>
                <p className="text-[11px] text-slate-500 font-medium">DGMS & OSHA Industrial Safety</p>
              </div>
            </div>

            <div className="inline-flex bg-slate-100 rounded-lg p-0.5 border border-slate-200">
              <button onClick={() => setLang('en')} className={`px-2 py-1 text-[11px] font-bold rounded-md ${lang === 'en' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>EN</button>
              <button onClick={() => setLang('hi')} className={`px-2 py-1 text-[11px] font-bold rounded-md ${lang === 'hi' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>हिंदी</button>
            </div>
          </header>

          {/* Main Content Viewport */}
          <main className="flex-1 overflow-y-auto pb-24">
            {/* TAB 1: MODULES */}
            {tab === 'modules' && (
              <div className="p-4 space-y-4">
                <div className="bg-gradient-to-r from-amber-500 to-orange-600 rounded-2xl p-4 text-slate-950 shadow-md flex items-center justify-between">
                  <div className="space-y-1">
                    <span className="text-[10px] bg-black/20 text-white px-2 py-0.5 rounded-full font-bold">Real-Time AR Camera Mode</span>
                    <h3 className="text-sm font-black">Live Fire Response Drill</h3>
                    <p className="text-[11px]">Scan room, isolate 440V, pull pin, aim & spray CO2.</p>
                  </div>
                  <button onClick={() => setTab('ar_camera')} className="h-11 px-4 rounded-xl bg-slate-950 text-amber-400 font-bold text-xs">Launch AR</button>
                </div>

                <div className="space-y-3">
                  {/* Card 1 */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
                    <div className="flex gap-3">
                      <div className="w-12 h-12 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center shrink-0">
                        <Icons.Flame />
                      </div>
                      <div className="flex-1">
                        <h4 className="text-sm font-black">1. Fire Safety (PASS Drill)</h4>
                        <p className="text-xs text-slate-600 font-medium">Electrical 440V cabinet fire, CO2 extinguisher sequence.</p>
                      </div>
                    </div>
                    <button onClick={() => setTab('ar_camera')} className="mt-3 w-full h-11 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl">Start Live Camera AR Drill</button>
                  </div>

                  {/* Card 2 */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
                    <div className="flex gap-3">
                      <div className="w-12 h-12 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-center shrink-0">
                        <Icons.Gauge />
                      </div>
                      <div className="flex-1">
                        <h4 className="text-sm font-black">2. Gas Safety (4-Gas Detector)</h4>
                        <p className="text-xs text-slate-600 font-medium">Underground sump telemetry: O2 (19.5-23.5%), CH4, and H2S limits.</p>
                      </div>
                    </div>
                  </div>

                  {/* Card 3 */}
                  <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
                    <div className="flex gap-3">
                      <div className="w-12 h-12 rounded-xl bg-sky-50 border border-sky-200 flex items-center justify-center shrink-0">
                        <Icons.HardHat />
                      </div>
                      <div className="flex-1">
                        <h4 className="text-sm font-black">3. PPE Readiness Drill</h4>
                        <p className="text-xs text-slate-600 font-medium">Cap-lamp helmet, chin strap, reflective boiler suit, steel-toe boots.</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: LIVE AR CAMERA */}
            {tab === 'ar_camera' && (
              <div className="p-4 space-y-3 bg-[#F8FAFC]">
                {/* Header */}
                <div className="p-3.5 rounded-2xl bg-white border border-slate-200 shadow-xs flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black">
                      <Icons.Flame />
                    </div>
                    <div>
                      <div className="flex items-center gap-1.5">
                        <span className="text-sm font-black text-slate-900">Spatial AR Drill</span>
                        <span className="bg-amber-100 text-amber-900 text-[10px] font-black px-1.5 py-0.5 rounded border border-amber-300">PASS</span>
                      </div>
                      <p className="text-[11px] text-slate-500">Rajesh Gope (WKR-4491)</p>
                    </div>
                  </div>
                  <button onClick={() => setTab('modules')} className="h-8 px-2.5 rounded-lg border border-slate-300 text-xs font-semibold text-slate-600 bg-white hover:bg-slate-50">Exit</button>
                </div>

                {/* 1. ACTUAL HARDWARE CAMERA INTEGRATION */}
                <div className="relative w-full h-72 sm:h-96 rounded-2xl overflow-hidden bg-black border border-slate-300 shadow-md">
                  <video 
                    ref={videoRef} 
                    autoPlay 
                    playsInline 
                    muted 
                    className="w-full h-full object-cover"
                  />

                  {/* Camera Permission / Error Trigger */}
                  {cameraError && (
                    <div className="absolute inset-0 bg-slate-950/90 z-20 flex flex-col items-center justify-center p-6 text-center text-white space-y-3">
                      <div className="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/50 flex items-center justify-center text-amber-400">
                        <Icons.Camera />
                      </div>
                      <div className="space-y-1">
                        <h3 className="text-sm font-bold text-slate-100">Camera Access Required</h3>
                        <p className="text-xs text-slate-400 max-w-xs leading-relaxed">
                          Allow camera permissions to view the interactive live AR fire guidance overlay.
                        </p>
                      </div>
                      <button 
                        onClick={startCamera} 
                        className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs shadow-lg transition active:scale-95"
                      >
                        Allow Camera Permission
                      </button>
                    </div>
                  )}

                  {/* 2. REAL-TIME AR FIRE GUIDANCE OVERLAY (INSIDE CAMERA VIEW) */}
                  <div className="absolute inset-0 pointer-events-none flex flex-col justify-between p-3 z-10">
                    {/* Top HUD: Flame Gauge & Hindi Guidance Banner */}
                    <div className="space-y-2 pointer-events-auto">
                      <div className="bg-slate-950/85 backdrop-blur-md border border-amber-400/50 rounded-xl px-3 py-1.5 flex items-center justify-between text-amber-300 shadow-lg">
                        <div className="flex items-center gap-2 min-w-0">
                          <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping shrink-0" />
                          <span className="text-[11px] font-bold truncate">
                            {powerOff ? (pinPulled ? (aimLocked ? 'CO2 स्प्रे करें (Press Spray CO2)' : 'आग की जड़ पर निशाना लगाएं (Aim at Base)') : 'अब सेफ्टी पिन निकालें (Pull Safety Pin)') : 'पहले मेन पावर बंद करें (Isolate Power Source)'}
                          </span>
                        </div>
                        <span className="text-[10px] font-mono text-slate-400 shrink-0 uppercase">DGMS PASS</span>
                      </div>

                      {/* Flame Gauge */}
                      <div className="bg-slate-950/80 backdrop-blur-md border border-slate-700/80 rounded-xl px-2.5 py-1.5 space-y-1 shadow-md">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="font-bold text-slate-200">Flame Gauge</span>
                          <span className={`font-mono font-black ${fireIntensity > 50 ? 'text-red-400' : fireIntensity > 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                            {fireIntensity}% {fireIntensity === 0 ? '(EXTINGUISHED)' : ''}
                          </span>
                        </div>
                        <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden border border-slate-700">
                          <div className={`h-full transition-all duration-300 rounded-full ${fireIntensity > 50 ? 'bg-gradient-to-r from-red-600 to-amber-500' : fireIntensity > 0 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${fireIntensity}%` }} />
                        </div>
                      </div>

                      {/* 4-Gas Sniffer AR HUD: H2S, O2, CO, CH4 */}
                      <div className="bg-slate-950/90 backdrop-blur-md border border-slate-700/90 rounded-xl p-2 space-y-1.5 shadow-xl">
                        <div className="flex items-center justify-between text-[10px]">
                          <div className="flex items-center gap-1.5 font-bold text-slate-200">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                            <span>DGMS 4-Gas Sniffer</span>
                            <span className="font-mono text-[9px] text-slate-400 bg-slate-900 px-1 py-0.2 rounded border border-slate-700">0.5L/m</span>
                          </div>
                          {(o2Val < 19.5 || coVal > 50 || h2sVal > 10.0 || ch4Val > 1.25) ? (
                            <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-500/60 animate-pulse">⚠️ ALARM</span>
                          ) : (
                            <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/60">✓ SAFE</span>
                          )}
                        </div>
                        <div className="grid grid-cols-4 gap-1 text-center font-mono">
                          <div className={`p-1 rounded-lg border ${o2Val < 19.5 ? 'bg-red-950/80 border-red-500 text-red-200' : 'bg-slate-900 border-slate-700 text-slate-200'}`}>
                            <div className="flex justify-between text-[8px] text-slate-400 font-sans font-bold"><span>O₂</span><span>&gt;19.5%</span></div>
                            <div className="text-xs font-black my-0.5">{o2Val}%</div>
                            <div className="w-full bg-slate-800 h-1 rounded-full overflow-hidden"><div className={`h-full ${o2Val < 19.5 ? 'bg-red-500' : 'bg-emerald-400'}`} style={{width: `${Math.min(100, (o2Val/22)*100)}%`}} /></div>
                            <div className="text-[7.5px] uppercase font-bold mt-0.5">{o2Val < 19.5 ? 'LOW O₂' : 'NORMAL'}</div>
                          </div>
                          <div className={`p-1 rounded-lg border ${coVal > 50 ? 'bg-red-950/80 border-red-500 text-red-200' : 'bg-slate-900 border-slate-700 text-slate-200'}`}>
                            <div className="flex justify-between text-[8px] text-slate-400 font-sans font-bold"><span>CO</span><span>&lt;50ppm</span></div>
                            <div className="text-xs font-black my-0.5">{coVal}</div>
                            <div className="w-full bg-slate-800 h-1 rounded-full overflow-hidden"><div className={`h-full ${coVal > 50 ? 'bg-red-500' : 'bg-emerald-400'}`} style={{width: `${Math.min(100, (coVal/400)*100)}%`}} /></div>
                            <div className="text-[7.5px] uppercase font-bold mt-0.5">{coVal > 50 ? 'TOXIC' : 'SAFE'}</div>
                          </div>
                          <div className={`p-1 rounded-lg border ${h2sVal > 10.0 ? 'bg-red-950/80 border-red-500 text-red-200' : 'bg-slate-900 border-slate-700 text-slate-200'}`}>
                            <div className="flex justify-between text-[8px] text-slate-400 font-sans font-bold"><span>H₂S</span><span>&lt;10ppm</span></div>
                            <div className="text-xs font-black my-0.5">{h2sVal}</div>
                            <div className="w-full bg-slate-800 h-1 rounded-full overflow-hidden"><div className={`h-full ${h2sVal > 10.0 ? 'bg-red-500' : 'bg-emerald-400'}`} style={{width: `${Math.min(100, (h2sVal/20)*100)}%`}} /></div>
                            <div className="text-[7.5px] uppercase font-bold mt-0.5">{h2sVal > 10.0 ? 'LETHAL' : 'CLEAR'}</div>
                          </div>
                          <div className={`p-1 rounded-lg border ${ch4Val > 1.25 ? 'bg-amber-950/80 border-amber-500 text-amber-200' : 'bg-slate-900 border-slate-700 text-slate-200'}`}>
                            <div className="flex justify-between text-[8px] text-slate-400 font-sans font-bold"><span>CH₄</span><span>&lt;1.25%</span></div>
                            <div className="text-xs font-black my-0.5">{ch4Val}%</div>
                            <div className="w-full bg-slate-800 h-1 rounded-full overflow-hidden"><div className={`h-full ${ch4Val > 1.25 ? 'bg-amber-500' : 'bg-emerald-400'}`} style={{width: `${Math.min(100, (ch4Val/2.5)*100)}%`}} /></div>
                            <div className="text-[7.5px] uppercase font-bold mt-0.5">{ch4Val > 1.25 ? 'LEL HIGH' : 'SAFE'}</div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Centered Simulated Animated Fire / Target Reticle */}
                    <div className="relative flex-1 flex items-center justify-center pointer-events-auto">
                      {fireIntensity > 0 ? (
                        <div className="relative flex flex-col items-center">
                          <div className="relative transition-all duration-300 flex items-end justify-center" style={{ transform: `scale(${Math.max(0.35, fireIntensity / 100)})`, transformOrigin: 'bottom center' }}>
                            <div className="text-amber-500 animate-bounce drop-shadow-[0_0_15px_rgba(245,158,11,0.8)]"><Icons.Flame /></div>
                          </div>
                          <button onClick={handleAim} className={`mt-1 px-3 py-1 rounded-full text-[10px] font-bold border transition flex items-center gap-1.5 backdrop-blur-md ${aimLocked ? 'bg-emerald-500 text-slate-950 border-emerald-400 font-black' : pinPulled ? 'bg-amber-500 text-slate-950 border-amber-300 animate-pulse' : 'bg-black/80 text-slate-300 border-slate-600'}`}>
                            <Icons.Crosshair />
                            <span>{aimLocked ? 'AIM BASE LOCKED ✓' : '🎯 AIM AT BASE'}</span>
                          </button>
                        </div>
                      ) : (
                        <div className="bg-emerald-950/85 border border-emerald-400 rounded-2xl px-5 py-3 text-center text-white backdrop-blur-md shadow-2xl animate-in zoom-in-95">
                          <Icons.Check />
                          <span className="text-xs font-black text-emerald-300 tracking-wider uppercase block mt-1">Fire Extinguished (0%)</span>
                        </div>
                      )}
                    </div>

                    {/* 4 Procedural Guidance Action Pills */}
                    <div className="pointer-events-auto pt-1 space-y-1.5">
                      <div className="grid grid-cols-4 gap-1.5 text-center text-[10px]">
                        <button onClick={handlePower} disabled={powerOff} className={`py-2 px-1 rounded-xl border flex flex-col items-center justify-center gap-0.5 font-bold transition shadow-sm ${powerOff ? 'bg-emerald-600/90 text-white border-emerald-400' : 'bg-slate-950/85 text-amber-300 border-amber-400 animate-pulse'}`}>
                          <Icons.Power />
                          <span className="truncate w-full">1. Power Off</span>
                        </button>
                        <button onClick={handlePin} disabled={pinPulled} className={`py-2 px-1 rounded-xl border flex flex-col items-center justify-center gap-0.5 font-bold transition shadow-sm ${pinPulled ? 'bg-emerald-600/90 text-white border-emerald-400' : powerOff ? 'bg-slate-950/85 text-amber-300 border-amber-400 animate-pulse' : 'bg-slate-900/60 text-slate-500 border-slate-700'}`}>
                          <Icons.Lock />
                          <span className="truncate w-full">2. Pull Pin</span>
                        </button>
                        <button onClick={handleAim} disabled={aimLocked || !pinPulled} className={`py-2 px-1 rounded-xl border flex flex-col items-center justify-center gap-0.5 font-bold transition shadow-sm ${aimLocked ? 'bg-emerald-600/90 text-white border-emerald-400' : pinPulled ? 'bg-slate-950/85 text-amber-300 border-amber-400 animate-pulse' : 'bg-slate-900/60 text-slate-500 border-slate-700'}`}>
                          <Icons.Crosshair />
                          <span className="truncate w-full">3. Aim Base</span>
                        </button>
                        <button onClick={handleSpray} disabled={!aimLocked || fireIntensity === 0} className={`py-2 px-1 rounded-xl border flex flex-col items-center justify-center gap-0.5 font-bold transition shadow-sm ${fireIntensity === 0 ? 'bg-emerald-600/90 text-white border-emerald-400' : aimLocked ? 'bg-sky-500 text-slate-950 border-sky-300 animate-pulse' : 'bg-slate-900/60 text-slate-500 border-slate-700'}`}>
                          <Icons.Wind />
                          <span className="truncate w-full">4. Spray CO2</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {alertMsg && (
                  <div className="bg-red-50 border border-red-300 text-red-800 rounded-xl p-3 text-xs font-semibold">
                    {alertMsg}
                  </div>
                )}

                {/* 3. TELEMETRY ACTION TRIGGERS (LIGHT THEME) */}
                <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
                  <div className="flex items-center justify-between text-xs font-bold text-slate-700">
                    <span>TELEMETRY ACTION TRIGGERS</span>
                    <span className="font-mono text-[10px] text-slate-500">CMR Reg 139</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <button onClick={() => speak('अलार्म सक्रिय!', 'Alarm Sounded!')} className="p-2.5 rounded-xl border border-slate-200 bg-[#F8FAFC] hover:bg-slate-100 font-bold flex items-center gap-2 text-slate-800">
                      <span>🔔 Sound Alarm</span>
                    </button>
                    <button onClick={() => speak('CO2 सिलेंडर तैयार!', 'CO2 Extinguisher Selected!')} className="p-2.5 rounded-xl border border-sky-200 bg-sky-50 font-bold flex items-center gap-2 text-sky-900">
                      <span>🧯 CO2 Extinguisher</span>
                    </button>
                    <button onClick={() => speak('सुरक्षित निकास B चुना गया।', 'Safe Exit B chosen.')} className="p-2.5 rounded-xl border border-emerald-200 bg-emerald-50 font-bold flex items-center gap-2 text-emerald-900">
                      <span>🟢 Exit B (Safe Lifeline)</span>
                    </button>
                    <button onClick={() => setAlertMsg('❌ चेतावनी: Exit A ब्लॉक है (CO 380 ppm धुआं)!')} className="p-2.5 rounded-xl border border-red-200 bg-red-50 font-bold flex items-center gap-2 text-red-900">
                      <span>🔴 Exit A (Blocked Danger)</span>
                    </button>
                  </div>

                  {/* 4-Gas Sniffer Regulatory Telemetry Strip */}
                  <div className="pt-2 border-t border-slate-100 space-y-1.5">
                    <div className="flex items-center justify-between text-[11px] font-bold text-slate-700">
                      <span>Live 4-Gas Sniffer Sensor Readings</span>
                      <span className="font-mono text-[9px] text-slate-500">DGMS Safe Limits</span>
                    </div>
                    <div className="grid grid-cols-4 gap-1.5 text-center font-mono text-xs">
                      <div className={`p-1.5 rounded-xl border ${o2Val < 19.5 ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="text-[9px] text-slate-500 font-sans">O₂ (Min 19.5%)</div>
                        <div className={`font-bold ${o2Val < 19.5 ? 'text-red-600' : 'text-slate-900'}`}>{o2Val}%</div>
                      </div>
                      <div className={`p-1.5 rounded-xl border ${coVal > 50 ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="text-[9px] text-slate-500 font-sans">CO (Max 50)</div>
                        <div className={`font-bold ${coVal > 50 ? 'text-red-600' : 'text-slate-900'}`}>{coVal}ppm</div>
                      </div>
                      <div className={`p-1.5 rounded-xl border ${h2sVal > 10.0 ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="text-[9px] text-slate-500 font-sans">H₂S (Max 10)</div>
                        <div className={`font-bold ${h2sVal > 10.0 ? 'text-red-600' : 'text-slate-900'}`}>{h2sVal}ppm</div>
                      </div>
                      <div className={`p-1.5 rounded-xl border ${ch4Val > 1.25 ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="text-[9px] text-slate-500 font-sans">CH₄ (Max 1.25%)</div>
                        <div className={`font-bold ${ch4Val > 1.25 ? 'text-amber-700' : 'text-slate-900'}`}>{ch4Val}%</div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* FINISH & EVALUATE IN ENGINE CTA */}
                <button 
                  onClick={() => setTab('assessment')} 
                  className="w-full h-12 rounded-xl flex items-center justify-center gap-2 font-bold bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 text-sm tracking-wide shadow-md transition"
                >
                  FINISH & EVALUATE IN ENGINE
                </button>
              </div>
            )}

            {/* TAB 3: ASSESSMENT */}
            {tab === 'assessment' && (
              <div className="p-4 space-y-4">
                {!submitted ? (
                  <div className="space-y-4">
                    <div className="flex justify-between text-xs font-bold">
                      <span className="font-mono text-slate-500">Question {qIndex + 1} of {questions.length}</span>
                      <span className="bg-amber-100 text-amber-900 px-2 py-0.5 rounded">Practical Evaluation</span>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
                      <h4 className="text-sm font-black text-slate-900">{questions[qIndex].q[lang]}</h4>
                      <div className="space-y-2">
                        {questions[qIndex].opts.map((opt, idx) => (
                          <button key={idx} onClick={() => setAnswers({ ...answers, [qIndex]: idx })} className={`w-full min-h-[48px] p-3 rounded-xl border text-left text-xs font-semibold ${answers[qIndex] === idx ? 'border-amber-500 bg-amber-50 text-slate-900 font-bold' : 'border-slate-200 bg-white text-slate-700'}`}>
                            {opt[lang]}
                          </button>
                        ))}
                      </div>
                    </div>

                    <button onClick={() => {
                      if (qIndex < questions.length - 1) {
                        setQIndex(qIndex + 1);
                      } else {
                        let sc = 0;
                        questions.forEach((q, i) => { if (answers[i] === q.ans) sc++; });
                        setScore(sc);
                        setSubmitted(true);
                      }
                    }} disabled={answers[qIndex] === undefined} className={`w-full h-12 rounded-xl font-bold text-xs ${answers[qIndex] !== undefined ? 'bg-amber-500 text-slate-950' : 'bg-slate-200 text-slate-400'}`}>
                      {qIndex === questions.length - 1 ? 'Submit Assessment' : 'Next Question'}
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-2">
                      <h3 className="text-lg font-black text-slate-900">{score >= 2 ? 'COMPETENCY PASSED' : 'RE-DRILL MANDATORY'}</h3>
                      <p className="text-xs text-slate-600">Your score: {score} / {questions.length} ({Math.round((score/questions.length)*100)}%)</p>
                      {score >= 2 && (
                        <button onClick={() => setModalOpen(true)} className="w-full h-12 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-md mt-4">View Verifiable Certificate</button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: CERTIFICATE */}
            {tab === 'cert' && (
              <div className="p-4 text-center space-y-4">
                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-3">
                  <div className="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center mx-auto text-amber-600"><Icons.Award /></div>
                  <h3 className="text-sm font-bold text-slate-900">National Mining Safety Registry</h3>
                  <button onClick={() => setModalOpen(true)} className="w-full h-12 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl shadow-xs">View Official Certificate</button>
                </div>
              </div>
            )}
          </main>

          {/* Certificate Modal */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl border border-slate-200 max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
                <span className="text-[10px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full border border-amber-300">DGMS STATUTORY RECORD</span>
                <h3 className="text-base font-black text-slate-900">Certificate of Competency</h3>
                <div className="text-xs text-left space-y-1.5 border-y border-slate-100 py-3 text-slate-600 font-medium">
                  <div>Trainee: <strong className="text-slate-900">Rajesh Gope</strong></div>
                  <div>ID: <strong className="font-mono text-slate-900">WKR-4491</strong></div>
                  <div>Course: <strong className="text-slate-900">DGMS CMR 2017 Fire & Gas Safety</strong></div>
                  <div>Status: <strong className="text-emerald-700">VERIFIED (PASS)</strong></div>
                </div>

                {/* SVG QR Code */}
                <div className="w-32 h-32 mx-auto bg-slate-50 p-2 rounded-xl border border-slate-200 flex items-center justify-center">
                  <svg className="w-full h-full" viewBox="0 0 100 100" fill="none">
                    <rect x="5" y="5" width="28" height="28" rx="4" fill="#0F172A" />
                    <rect x="13" y="13" width="12" height="12" rx="1" fill="#FFFFFF" />
                    <rect x="67" y="5" width="28" height="28" rx="4" fill="#0F172A" />
                    <rect x="75" y="13" width="12" height="12" rx="1" fill="#FFFFFF" />
                    <rect x="5" y="67" width="28" height="28" rx="4" fill="#0F172A" />
                    <rect x="13" y="75" width="12" height="12" rx="1" fill="#FFFFFF" />
                    <circle cx="48" cy="48" r="6" fill="#D97706" />
                    <rect x="40" y="65" width="8" height="8" fill="#0F172A" />
                  </svg>
                </div>
                <div className="text-[10px] font-mono text-slate-400">CERT-SURAKSHA-914820</div>

                <div className="space-y-2 pt-2">
                  <button onClick={() => alert('PDF Certificate Downloaded!')} className="w-full h-11 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl shadow-xs">Download PDF</button>
                  <button onClick={() => setModalOpen(false)} className="w-full h-10 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Fixed Bottom Navigation (4 Ergonomic Tabs) */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-white border-t border-[#E2E8F0] px-2 py-2 flex items-center justify-around shadow-lg">
            <button onClick={() => setTab('modules')} className={`flex-1 flex flex-col items-center py-1 ${tab === 'modules' ? 'text-amber-600 font-bold' : 'text-slate-500'}`}>
              <Icons.Layers />
              <span className="text-[10px] mt-0.5">Modules</span>
            </button>
            <button onClick={() => setTab('ar_camera')} className={`flex-1 flex flex-col items-center py-1 ${tab === 'ar_camera' ? 'text-amber-600 font-bold' : 'text-slate-500'}`}>
              <Icons.Camera />
              <span className="text-[10px] mt-0.5">Live AR</span>
            </button>
            <button onClick={() => setTab('assessment')} className={`flex-1 flex flex-col items-center py-1 ${tab === 'assessment' ? 'text-amber-600 font-bold' : 'text-slate-500'}`}>
              <Icons.Check />
              <span className="text-[10px] mt-0.5">Assessment</span>
            </button>
            <button onClick={() => setTab('cert')} className={`flex-1 flex flex-col items-center py-1 ${tab === 'cert' ? 'text-amber-600 font-bold' : 'text-slate-500'}`}>
              <Icons.Award />
              <span className="text-[10px] mt-0.5">Certificate</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
